apiVersion: apps/v1
kind: Deployment
metadata:
  name: deployment-2048
  namespace: game-2048
spec:
  replicas: 5
  selector:
    matchLabels:
      app.kubernetes.io/name: app-2048
  template:
    metadata:
      labels:
        app.kubernetes.io/name: app-2048
    spec:
      containers:
      - name: app-2048
        image: 774928063762.dkr.ecr.us-east-1.amazonaws.com/custom-2048:game-v1
        imagePullPolicy: Always
        ports:
        - containerPort: 80
